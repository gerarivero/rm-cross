#cloud-config
# Provisioning para el droplet de Centro RM (Ubuntu 22.04 LTS).
# Se pasa como --user-data al crear el droplet (ver infra/create-droplet.sh).
# La public key de deploy se agrega vía --ssh-keys en la creación del droplet,
# no acá: cloud-init la instala solo para el usuario `deploy` que este archivo crea.

users:
  - name: deploy
    groups: sudo
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys:
      - __DEPLOY_PUBLIC_KEY__

package_update: true
package_upgrade: true

packages:
  - nginx
  - certbot
  - python3-certbot-nginx
  - ufw
  - rsync

write_files:
  - path: /etc/systemd/system/centro-rm.service
    permissions: "0644"
    content: |
      __CENTRO_RM_SERVICE__

  - path: /etc/nginx/sites-available/centro-rm
    permissions: "0644"
    content: |
      __NGINX_CONF__

  - path: /var/www/centro-rm/shared/.env.production
    permissions: "0600"
    owner: deploy:deploy
    content: |
      # Completar a mano tras la creación del droplet (ver docs/deploy.md, paso 6).
      # SUPABASE_URL=
      # SUPABASE_SERVICE_ROLE_KEY=
      # NEXT_PUBLIC_SUPABASE_URL=
      # NEXT_PUBLIC_SUPABASE_ANON_KEY=

runcmd:
  # Node.js 20 LTS (NodeSource)
  - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
  - apt-get install -y nodejs

  # Estructura de releases (mismo layout que espera el workflow de deploy)
  - mkdir -p /var/www/centro-rm/releases
  - chown -R deploy:deploy /var/www/centro-rm

  # Nginx: habilitar el site, sacar el default
  - rm -f /etc/nginx/sites-enabled/default
  - ln -sf /etc/nginx/sites-available/centro-rm /etc/nginx/sites-enabled/centro-rm
  - nginx -t
  - systemctl restart nginx

  # Servicio de la app (no arranca todavía: no hay ningún release desplegado)
  - systemctl daemon-reload
  - systemctl enable centro-rm

  # Firewall: solo SSH + HTTP/HTTPS
  - ufw allow OpenSSH
  - ufw allow "Nginx Full"
  - ufw --force enable
